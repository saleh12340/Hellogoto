name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create CI environment files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'GEMINI_API_KEY=dummy_key_for_ci' > .env
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.aistudio.omniai.vxtzqr"}},"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}
          JSON
          fi

      - name: Prepare valid debug keystore
        shell: bash
        run: |
          set -euo pipefail
          rm -f debug.keystore
          if [ -f debug.keystore.base64 ]; then
            if base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null && \
               keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "Using repository debug keystore"
            else
              echo "Repository debug.keystore.base64 is invalid; generating a fresh CI keystore"
              rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Debug keystore ready: $(du -h debug.keystore | cut -f1)"

      - name: Fix Gradle wrapper permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not produced at $APK"
            find app/build/outputs -type f -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi
          echo "APK successfully produced: $APK"
          ls -lh "$APK"
          file "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hellogoto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
